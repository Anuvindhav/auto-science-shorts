name: Make short
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title / topic"
        required: true
        default: "Gravity in 30 seconds"
      length:
        description: "Video length in seconds"
        required: true
        type: choice
        default: "45"
        options:
          - "30"
          - "45"
          - "60"
          - "90"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install edge-tts requests
      - name: Make the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TITLE: ${{ github.event.inputs.title }}
          LENGTH: ${{ github.event.inputs.length }}
        run: python auto_science_shorts.py "$TITLE" "$LENGTH"
      - name: Save a zip backup
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            short.mp4
            metadata.txt
      - name: Publish video as a release (direct mp4 download)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.inputs.title }}
        run: gh release create "short-${{ github.run_number }}" short.mp4 metadata.txt --title "$TITLE" --notes-file metadata.txt
