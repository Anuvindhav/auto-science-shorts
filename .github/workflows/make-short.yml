name: Make short
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Video title / topic"
        required: true
        default: "Gravity in 30 seconds"
      length:
        description: "Video length in seconds"
        required: true
        type: choice
        default: "45"
        options:
          - "30"
          - "45"
          - "60"
          - "90"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install edge-tts requests

      - name: Generate Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_LENGTH: ${{ inputs.length }}
        run: python auto_science_shorts.py "$INPUT_TITLE" "$INPUT_LENGTH"

      - name: Publish video as a release (direct mp4 download)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          TAG="short-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" short.mp4 metadata.txt --title "$TITLE" --notes-file metadata.txt

      - uses: actions/upload-artifact@v4
        with:
